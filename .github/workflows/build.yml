name: Build

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out Navify Creator
        uses: actions/checkout@v4
        with:
          repository: Navify/navify-creator
          path: navify-creator

      - name: Link Navify Creator workspace
        run: ln -s "$GITHUB_WORKSPACE/navify-creator" "$(dirname "$GITHUB_WORKSPACE")/navify-creator"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          run_install: false

      - name: Install Node.js (v24)
        uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Navify Creator
        run: pnpm --dir ../navify-creator/packages/navify-creator build

      - name: Build
        run: pnpm build:local
