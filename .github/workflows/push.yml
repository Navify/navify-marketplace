name: Push new version to dist branch
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Push
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: dist
    permissions:
      contents: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out Navify Creator
        uses: actions/checkout@v4
        with:
          repository: Navify/navify-creator
          path: navify-creator

      - name: Link Navify Creator workspace
        run: ln -s "$GITHUB_WORKSPACE/navify-creator" "$(dirname "$GITHUB_WORKSPACE")/navify-creator"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Configure Git
        run: |
          git config --global user.name "Github Actions"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin HEAD
          if git ls-remote --exit-code --heads origin $TARGET_BRANCH >/dev/null 2>&1; then
            git worktree add -B $TARGET_BRANCH dist origin/$TARGET_BRANCH
          else
            git worktree add --detach dist
            cd dist
            git switch --orphan $TARGET_BRANCH
            git rm -rf . || true
            cd ..
          fi

      - name: Install Dependencies and Build
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir ../navify-creator/packages/navify-creator build
          pnpm build:prod

      - name: Push New Version
        run: |
          export SHORT_SHA=$(git rev-parse --short HEAD)
          cd dist
          git add .
          git diff-index --quiet HEAD || git commit -am "Update to output generated at $SHORT_SHA"
          git push origin $TARGET_BRANCH
