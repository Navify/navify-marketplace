name: Push new version to dist branch
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Push
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: dist
    permissions:
      contents: write
    steps:
      - name: Check out Marketplace
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out Navify Creator
        uses: actions/checkout@v4
        with:
          repository: Navify/navify-creator
          path: navify-creator

      - name: Check out Navify CLI
        uses: actions/checkout@v4
        with:
          repository: Navify/navify-cli
          path: Navify

      - name: Check out Navify Themes
        uses: actions/checkout@v4
        with:
          repository: Navify/navify-themes
          path: navify-themes

      - name: Link Navify Creator workspace
        run: ln -s "$GITHUB_WORKSPACE/navify-creator" "$(dirname "$GITHUB_WORKSPACE")/navify-creator"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies and build
        env:
          NAVIFY_PROJECT_ROOT: ${{ github.workspace }}
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir ../navify-creator/packages/navify-creator build
          pnpm build:prod

      - name: Prepare dist branch
        run: |
          git config --global user.name "Github Actions"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          target="$RUNNER_TEMP/navify-marketplace-dist"
          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
            git worktree add -B "$TARGET_BRANCH" "$target" "origin/$TARGET_BRANCH"
          else
            git worktree add --detach "$target"
            cd "$target"
            git switch --orphan "$TARGET_BRANCH"
            git rm -rf . || true
          fi

      - name: Push new version
        run: |
          output="$GITHUB_WORKSPACE/dist"
          target="$RUNNER_TEMP/navify-marketplace-dist"
          find "$target" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$output"/. "$target"/
          cd "$target"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update to output generated at $(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)"
          fi
          git push origin "$TARGET_BRANCH"